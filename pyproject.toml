[project]
name = "liboo"
version = "0.1.0"
description = "A book stock management system for a library."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bcrypt==3.2.0",
    "bs4>=0.0.2",
    "email-validator>=2.2.0",
    "fastapi[standard]>=0.115.12",
    "nanoid>=2.0.0",
    "passlib>=1.7.4",
    "pydantic-settings>=2.9.1",
    "pyjwt>=2.10.1",
    "pymysql>=1.1.1",
    "requests>=2.32.3",
    "sqlalchemy>=2.0.40",
]
license = {text = "MIT"}
authors = [
    {name = "Taib", email = "seantaib@gmail.com"},
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
]
